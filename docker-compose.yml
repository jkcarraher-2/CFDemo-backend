services:
  cf:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      - cfconfigfile=/app/CFConfig.json
      - cfconfig_adminPassword=${CF_ADMIN_PASSWORD}
      - BOX_SERVER_PROFILE=development
      - BOX_SERVER_WEB_REWRITES_ENABLE=true

    volumes:
      - ./app:/app
      - ./databases:/databases
      - ./drivers:/drivers
    