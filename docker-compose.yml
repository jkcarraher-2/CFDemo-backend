services:
  cf:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      - BOX_SERVER_CFCONFIGFILE=/app/CFConfig.json
      - cfconfig_adminPassword=${CF_ADMIN_PASSWORD}
      - BOX_SERVER_PROFILE=development
      - BOX_SERVER_WEB_REWRITES_ENABLE=true

    volumes:
      - ./app:/app
      - ./databases:/databases
      - ./drivers:/drivers
  
  tailwind:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/tailwindcss"]
    command:
      - "-i"
      - "/app/assets/css/input.css"
      - "-o"
      - "/app/assets/css/output.css"
      - "--watch=always"
    volumes:
      - ./app:/app